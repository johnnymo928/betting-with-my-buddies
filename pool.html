<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool &middot; Betting With Buds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img class="logo-mark" src="logo.png" alt="" width="113" height="96">
        <div><h1 aria-label="Betting With Buds"><span class="l1">Betting With</span><span class="l2">Buds</span></h1><p class="tagline">NFL Pool</p></div>
    </div>
</header>

<main class="dashboard page-narrow wide">
    <section class="panel panel-wide">
        <div class="panel-head">
            <h2><span class="tag tag-gold">POOL</span> <span id="week-title">NFL</span></h2>
            <span class="page-info" id="pool-clock"></span>
        </div>
        <div class="pool-controls">
            <label>Your profile <select id="pool-profile"></select></label>
            <div class="seg" id="pool-mode" role="radiogroup" aria-label="Pool type">
                <button type="button" data-mode="survivor" class="on" role="radio" aria-checked="true">Survivor</button>
                <button type="button" data-mode="pickem" role="radio" aria-checked="false">Pick'em</button>
            </div>
        </div>
        <p class="hint" id="rules"></p>
        <div class="form-error" id="pool-error" role="alert"></div>
        <div id="games"></div>
    </section>

    <section class="panel panel-wide">
        <div class="panel-head"><h2><span class="tag">STANDINGS</span> <span id="stand-title"></span></h2></div>
        <div class="table-wrap"><table class="table" id="standings"></table></div>
        <p class="hint muted">Picks stay hidden from everyone else until that game kicks off.</p>
    </section>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="live.js"></script>
<script src="nav.js"></script>
<script src="pool.js"></script>
</body>
</html>
