<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bettin with Buds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar has-qr">
    <div class="brand">
        <img class="logo-mark" src="logo.png" alt="" width="99" height="84">
        <div>
            <h1 aria-label="Bettin with Buds"><span class="l1">Bettin w/</span><span class="l2">Buds</span></h1>
            <p class="tagline">Scores &middot; Lines &middot; Slips</p>
        </div>
    </div>
    <div class="topright">
        <div class="clock" id="clock"></div>
    </div>
    <a class="qr" id="qr" href="bet.html" aria-label="Scan to place a bet">
        <span class="qr-code" id="qr-code" aria-hidden="true"></span>
        <span class="qr-label">Scan to<br>place a bet</span>
    </a>
</header>

<div id="hit-banners" class="hit-banners" aria-live="polite"></div>

<main class="dashboard">

    <div class="sport-bar">
        <label for="sport-pick">Sport</label>
        <select id="sport-pick" aria-label="Choose a sport">
            <option value="football">Football (NFL + College)</option>
            <option value="nba">NBA Basketball</option>
            <option value="nhl">NHL Hockey</option>
            <option value="mlb">MLB Baseball</option>
        </select>
    </div>

    <section class="panel" aria-labelledby="nfl-title">
        <div class="panel-head">
            <h2 id="nfl-title"><span class="tag">NFL</span> Scores &amp; Lines</h2>
            <span class="page-info" id="nfl-status"></span>
        </div>
        <div class="games" id="nfl-container"></div>
        <div class="dots" id="nfl-dots"></div>
    </section>

    <section class="panel" aria-labelledby="ncaaf-title">
        <div class="panel-head">
            <h2 id="ncaaf-title"><span class="tag tag-alt">NCAAF</span> Scores &amp; Lines</h2>
            <span class="page-info" id="ncaaf-status"></span>
        </div>
        <div class="games" id="ncaaf-container"></div>
        <div class="dots" id="ncaaf-dots"></div>
    </section>

    <section class="panel panel-wide" id="more-panel" aria-labelledby="more-title" hidden>
        <div class="panel-head">
            <h2 id="more-title"><span class="tag tag-gold" id="more-tag">NBA</span> Scores &amp; Lines</h2>
            <span class="page-info" id="more-status"></span>
        </div>
        <div class="games" id="more-container"></div>
        <div class="dots" id="more-dots"></div>
    </section>

    <section class="panel panel-wide" aria-labelledby="bets-title">
        <div class="panel-head">
            <h2 id="bets-title"><span class="tag tag-gold">SLIP</span> Today's Bets</h2>
            <span class="page-info"><span id="bets-count"></span> <a class="link" href="bet.html">+ Place a bet</a></span>
        </div>
        <div class="bet-list" id="bets"></div>
        <div class="dots" id="bets-dots"></div>
    </section>

</main>

<footer class="ticker" id="ticker" aria-label="Live ticker">
    <span class="ticker-label">LIVE</span>
    <div class="ticker-track">
        <div class="ticker-content" id="ticker-content">Loading scores&hellip;</div>
    </div>
</footer>
<p class="version">Version 2.0</p>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="live.js"></script>
<script src="odds.js"></script>
<script src="ui.js"></script>
<script src="nav.js"></script>
<script src="qrcode.js"></script>
<script src="roasts.js"></script>
<script src="script.js"></script>
</body>
</html>
