<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squares &middot; Bettin with Buddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img class="logo-mark" src="logo.png" alt="" width="113" height="96">
        <div><h1 aria-label="Bettin with Buddies"><span class="l1">Bettin With</span><span class="l2">Buddies</span></h1><p class="tagline">Squares</p></div>
    </div>
</header>

<main class="dashboard page-narrow wide">
    <section class="panel panel-wide">
        <div class="panel-head">
            <h2><span class="tag tag-gold">SQUARES</span> <span id="sq-title">Pick a board</span></h2>
            <span class="page-info" id="sq-info"></span>
        </div>
        <div class="pool-controls">
            <label>Board <select id="sq-board"></select></label>
            <label>Your profile <select id="sq-profile"></select></label>
        </div>
        <p class="hint" id="sq-rules"></p>
        <div class="form-error" id="sq-error" role="alert"></div>
        <div id="sq-grid-wrap" class="sq-wrap"></div>
    </section>

    <section class="panel panel-wide" id="sq-win-panel" hidden>
        <div class="panel-head"><h2><span class="tag">WINNERS</span> Payouts</h2></div>
        <div class="table-wrap"><table class="table" id="sq-winners"></table></div>
    </section>

    <section class="panel panel-wide" id="sq-owe-panel" hidden>
        <div class="panel-head"><h2><span class="tag tag-alt">WHO OWES</span> Buy-ins &amp; Winnings</h2></div>
        <div class="table-wrap"><table class="table" id="sq-owes"></table></div>
        <p class="hint muted">Owes = squares x price, due before the game. Net = winnings minus what you owe. The site only tracks it; money moves between you.</p>
    </section>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="live.js"></script>
<script src="nav.js"></script>
<script src="squares.js"></script>
</body>
</html>
