<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; Bettin with Buddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img class="logo-mark" src="logo.png" alt="" width="113" height="96">
        <div><h1 aria-label="Bettin with Buddies"><span class="l1">Bettin With</span><span class="l2">Buddies</span></h1><p class="tagline">Sign in</p></div>
    </div>
</header>

<main class="dashboard login-wrap">
    <!-- Step 1: unlock a group -->
    <section class="panel" id="step-group">
        <div class="panel-head"><h2><span class="tag tag-gold">GROUP</span> Join your group</h2></div>
        <form id="group-form" class="form" novalidate>
            <label>Group
                <select id="g-pick"></select>
            </label>
            <label id="g-secret-wrap"><span id="g-prompt">Group PIN</span>
                <input id="g-secret" type="password" autocomplete="off">
            </label>
            <p class="form-error" id="g-error" role="alert"></p>
            <button class="btn primary" type="submit">Continue</button>
            <p class="hint">Anyone who knows the group's PIN (or the answer to its question) can join. Ask the person who runs your group.</p>
        </form>
    </section>

    <!-- Step 2: who are you -->
    <section class="panel" id="step-who" hidden>
        <div class="panel-head"><h2><span class="tag tag-alt">YOU</span> <span id="w-title">Who are you?</span></h2></div>
        <form id="who-form" class="form" novalidate>
            <label>Pick your name
                <select id="w-pick"></select>
            </label>
            <label id="w-new-wrap" hidden>Your name
                <input id="w-new" type="text" maxlength="24" autocomplete="off">
            </label>
            <p class="form-error" id="w-error" role="alert"></p>
            <button class="btn primary" type="submit">Let me in</button>
            <button class="btn ghost" type="button" id="w-back">Back</button>
        </form>
    </section>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="login.js"></script>
</body>
</html>
